<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#EDF0EA;
  --surface:#FFFFFF;
  --surface-2:#F4F5F7;
  --ink:#1E2A22;
  --ink-soft:#5A6459;
  --ink-faint:#8B9389;
  --line:#DCE0D6;

  --brand:#2F5D50;
  --brand-dark:#1E3E35;

  --c-backlog:#46607A;
  --c-backlog-bg:#EAEEF2;
  --c-meetings:#2F6E52;
  --c-meetings-bg:#E8F1EA;
  --c-later:#B87A25;
  --c-later-bg:#F5EDDF;
  --c-acquired:#8C5A2B;
  --c-acquired-bg:#F3E9DB;

  --hot:#D10910;
  --hot-lightest:#FAE6E7;
  --warm:#C08A3E;
  --cold:#4A7196;

  /* Figma variables — "MM reality dashboard" file, Color collection (pulled via get_variable_defs) */
  --mm-green:#53BD04;         /* Color/Primary Light */
  --mm-green-dark:#387B22;    /* Color/Primary */
  --mm-green-lightest:#E1F8D6;/* Color/Primary Lightest */
  --mm-gray-dark:#333333;     /* Color/Gray/Dark — also "Icon Color" */
  --mm-gray:#8A8A8A;          /* Color/Gray/D-Gray */
  --mm-gray-light:#FFFFFF;    /* Color/Gray/Light */
  --mm-gray-line:#D3D7DE;     /* Color/Gray/L-Gray — card borders */
  --mm-gray-mid:#B0B5C1;      /* Color/Gray/M-Gray — panel/section borders */
  --mm-ls-gray:#F4F5F7;       /* Color/Gray/LS-Gray — container background */

  --radius:10px;
  --shadow:0 1px 2px rgba(30,42,34,0.06), 0 4px 14px rgba(30,42,34,0.06);
  --shadow-lift:0 8px 24px rgba(30,42,34,0.16);
}

html[data-theme="dark"]{
  --bg:#141812;
  --surface:#1D2319;
  --surface-2:#252C20;
  --ink:#ECF1E6;
  --ink-soft:#AEB8A6;
  --ink-faint:#77816F;
  --line:#333B2C;

  --brand-dark:#0F1912;

  --c-backlog-bg:#1E2733;
  --c-meetings-bg:#1C2A1F;
  --c-later-bg:#2C2416;
  --c-acquired-bg:#2A2016;

  --mm-gray-dark:#ECF1E6;
  --mm-gray:#9DA895;
  --mm-gray-light:#1D2319;
  --mm-gray-line:#333B2C;
  --mm-gray-mid:#3A4432;
  --mm-ls-gray:#1D2319;
  --mm-green-lightest:#20301A;
  --hot-lightest:#3A2420;

  --shadow:0 1px 2px rgba(0,0,0,0.35), 0 4px 14px rgba(0,0,0,0.3);
  --shadow-lift:0 8px 28px rgba(0,0,0,0.55);
}
html[data-theme="dark"] .search-wrap.on-light input,
html[data-theme="dark"] select.filter.on-light{
  background:var(--surface); color:var(--ink); border:1px solid var(--line);
}
html[data-theme="dark"] .cards::-webkit-scrollbar-thumb{background:#3A4432;}
html[data-theme="dark"] .queue-btn:hover{background:var(--mm-green-lightest);}
html, body{transition:background-color .2s ease, color .2s ease;}
.page-header, .toolbar-row, .column, .card, .modal, .drawer-panel, .cards, .btn, select.filter, input{
  transition:background-color .2s ease, color .2s ease, border-color .2s ease;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Page Header (Figma "Page Header - Panel", node 251:6450) ---------- */
.page-header{
  background:var(--surface);
  padding:16px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:16px;
  border-bottom:1px solid var(--line);
}
.page-header-left{
  display:flex;
  align-items:center;
  gap:32px;
  flex:1 1 320px;
  flex-wrap:wrap;
  min-width:0;
}
.h1-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
  flex-shrink:0;
}
.drawer-title-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
}
.h1-wrap h1{
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:32px;
  color:var(--mm-gray-dark);
  margin:0;
  white-space:nowrap;
  line-height:1.1;
}
.info-icon-btn{
  border:none;
  background:none;
  padding:0;
  width:24px; height:24px;
  color:var(--mm-gray-dark);
  cursor:pointer;
  flex-shrink:0;
  display:flex;
}
.info-icon-btn:hover{color:var(--mm-green-dark);}
.info-icon-btn[aria-expanded="true"]{color:var(--mm-green);}

.backlog-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--mm-green-dark);
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  flex-shrink:0;
  font-family:'Inter',sans-serif;
}
.backlog-btn:hover{filter:brightness(0.92);}
.backlog-btn span{
  font-size:16px;
  font-weight:600;
  text-transform:uppercase;
  white-space:nowrap;
}

.page-header-right{
  display:flex;
  align-items:center;
  gap:16px;
  flex-shrink:0;
}
.darkmode-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:#333333;
  border:none;
  color:#fff;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
}
.darkmode-btn:hover{filter:brightness(1.2);}
.darkmode-btn span:first-child{font-size:14px; font-weight:400; white-space:nowrap;}
.darkmode-btn svg{display:block;}
html[data-theme="dark"] .darkmode-btn{background:#F4F5F7; color:#1A1A1A;}
html[data-theme="dark"] .darkmode-btn:hover{filter:brightness(0.95);}

.header-avatar{
  width:40px; height:40px;
  border-radius:32px;
  border:1px solid var(--surface);
  box-shadow:0 0 4px 0 rgba(0,0,0,0.3);
  background:linear-gradient(135deg, var(--mm-green) 0%, var(--mm-green-dark) 100%);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.header-avatar img{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
}

.help-icon,
.brand-title-row{ /* legacy aliases kept harmless if referenced anywhere */ }
.help-tooltip{
  position:absolute;
  top:50%;
  left:calc(100% + 10px);
  transform:translateY(-50%);
  z-index:50;
  background:#333333;
  color:#FFFFFF;
  opacity:0.9;
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:400;
  line-height:1.35;
  padding:8px 12px;
  border-radius:4px;
  width:max-content;
  max-width:280px;
  box-shadow:var(--shadow-lift);
  display:none;
}
.help-tooltip.open{display:block;}
.help-tooltip::before{
  content:"";
  position:absolute;
  top:50%; left:-6px;
  transform:translateY(-50%);
  width:0; height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-right:6px solid #333333;
}
.drawer-title-wrap .help-tooltip{
  top:calc(100% + 10px);
  left:0;
  transform:none;
}
.drawer-title-wrap .help-tooltip::before{
  top:-6px; left:8px; transform:none;
  border-right:6px solid transparent; border-left:6px solid transparent; border-bottom:6px solid #333333; border-top:none;
}
@media (max-width:700px){
  .help-tooltip{left:0; top:calc(100% + 10px); transform:none;}
  .help-tooltip::before{left:8px; top:-6px; transform:none; border-right:6px solid transparent; border-left:6px solid transparent; border-bottom:6px solid #333333; border-top:none;}
}

/* ---------- Toolbar row (search + filters) ---------- */
.toolbar-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  padding:12px 16px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
}
.search-wrap{
  position:relative;
}
.toolbar-row .search-wrap{
  flex:1 1 240px;
  min-width:160px;
}
.search-wrap input{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:9px 12px 9px 32px;
  font-size:13.5px;
  width:100%;
  font-family:'Inter',sans-serif;
}
.search-wrap input::placeholder{color:var(--ink-faint);}
.search-wrap input:focus{outline:2px solid var(--mm-green); outline-offset:1px;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:0.75;}

select.filter{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:9px 10px;
  font-size:13.5px;
  font-family:'Inter',sans-serif;
}

.search-wrap.on-light input{
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line);
}
.search-wrap.on-light input::placeholder{color:var(--ink-faint);}
.search-wrap.on-light svg{opacity:0.6;}
select.filter.on-light{
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line);
}


.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ---------- Board ---------- */
.board{
  display:flex;
  gap:20px;
  padding:24px 24px 40px;
  overflow-x:auto;
  align-items:flex-start;
}
.column{
  background:var(--surface-2);
  border-radius:18px;
  min-width:310px;
  max-width:340px;
  flex:1 0 310px;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 100px);
  border:1px solid var(--line);
  box-shadow:none;
  overflow:hidden;
  position:relative;
}
.column::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0;
  height:4px;
  z-index:1;
}
.col-backlog::before{background:var(--c-backlog);}
.col-meetings::before{background:var(--c-meetings);}
.col-later::before{background:var(--c-later);}
.col-acquired::before{background:var(--c-acquired);}
.column-head{
  padding:20px 18px 14px;
  border:none;
  background:transparent;
  display:flex;
  align-items:center;
  gap:10px;
}
.column-head svg{
  order:1;
  flex-shrink:0;
  background:var(--surface-2);
  border-radius:10px;
  padding:6px;
  box-sizing:content-box;
}
.column-head h2{
  order:2;
  flex:1;
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.04em;
  margin:0;
  color:var(--ink-soft);
  line-height:1.3;
  text-align:left;
}
.column-count{
  order:3;
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  color:#fff;
  min-width:22px;
  height:22px;
  padding:0 7px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.col-backlog .column-count,
.col-meetings .column-count,
.col-later .column-count,
.col-acquired .column-count{background:#8A8A8A; color:#fff;}
.col-backlog .column-head svg,
.col-meetings .column-head svg,
.col-later .column-head svg,
.col-acquired .column-head svg{color:#8A8A8A;}
html[data-theme="dark"] .col-backlog .column-count,
html[data-theme="dark"] .col-meetings .column-count,
html[data-theme="dark"] .col-later .column-count,
html[data-theme="dark"] .col-acquired .column-count{background:#E6E6E6; color:#1A1A1A;}
html[data-theme="dark"] .col-backlog .column-head svg,
html[data-theme="dark"] .col-meetings .column-head svg,
html[data-theme="dark"] .col-later .column-head svg,
html[data-theme="dark"] .col-acquired .column-head svg{color:#E6E6E6;}

.cards{
  padding:6px 14px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow-y:auto;
  flex:1;
}
.cards.drag-over{background:rgba(83,189,4,0.07); outline:2px dashed var(--mm-green); outline-offset:-6px; border-radius:8px;}
.column.column-drag-over{
  border-color:var(--mm-green);
  box-shadow:0 0 0 2px var(--mm-green);
}
.column.column-drag-over .column-head{background:var(--mm-green-lightest);}
.column.column-drag-over .column-head h2{color:var(--mm-green-dark);}
.cards::-webkit-scrollbar{width:7px;}
.cards::-webkit-scrollbar-thumb{background:#CCD3C6; border-radius:6px;}

.empty-hint{
  font-size:12.5px;
  color:var(--ink-faint);
  text-align:center;
  padding:22px 10px;
  border:1.5px dashed var(--line);
  border-radius:8px;
}

/* ---------- Card ---------- */
.card{
  background:var(--surface);
  border-radius:9px;
  padding:11px 12px 10px;
  box-shadow:var(--shadow);
  cursor:grab;
  border-left:4px solid var(--ink-faint);
  transition:box-shadow .15s ease, transform .15s ease;
}
.card:hover{box-shadow:var(--shadow-lift); transform:translateY(-1px);}
.card:focus-visible{outline:2px solid var(--mm-green); outline-offset:2px;}
.card.dragging{opacity:0.4;}
.col-backlog .card{border-left-color:var(--c-backlog);}
.col-meetings .card{border-left-color:var(--c-meetings);}
.col-later .card{border-left-color:var(--c-later);}
.col-acquired .card{border-left-color:var(--c-acquired);}

.card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:6px;
  gap:6px;
}
.chip{
  font-size:10.5px;
  font-weight:600;
  padding:2px 7px;
  border-radius:20px;
  background:var(--surface-2);
  color:var(--ink-soft);
  border:1px solid var(--line);
  white-space:nowrap;
}
.temp{
  display:flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;
}
.temp .dot{width:7px;height:7px;}
.temp.hot .dot{background:var(--hot);} .temp.hot{color:var(--hot);}
.temp.warm .dot{background:var(--warm);} .temp.warm{color:var(--warm);}
.temp.cold .dot{background:var(--cold);} .temp.cold{color:var(--cold);}

.card-name{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:15px;
  margin:0 0 2px;
  color:var(--ink);
}
.card-locality{font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
.card-price{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:500;
  color:var(--brand-dark);
  margin-bottom:7px;
}
.card-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding-top:7px;
  border-top:1px solid var(--line);
}
.phone-link{
  font-family:'Inter',sans-serif;
  font-size:12px;
  color:var(--ink-soft);
  text-decoration:none;
}
.phone-link:hover{color:var(--mm-green-dark);}
.call-btn{
  border:none;
  background:var(--mm-green);
  color:#fff;
  width:26px;height:26px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}
.call-btn:hover{background:var(--mm-green-dark);}
.card-meta-line{
  font-size:11.5px;
  color:var(--ink-faint);
  margin-top:6px;
}

/* ---------- Backlog Card — Figma "Card Backlog / Molecule" (node 9:58) ---------- */
.card.card-backlog-molecule, .card.kanban-molecule{
  background:var(--mm-gray-light);
  border:1px solid var(--mm-gray-line);
  border-left:1px solid var(--mm-gray-line);
  border-radius:8px;
  box-shadow:0 0 16px 0 rgba(0,0,0,0.1);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:18px;
  height:auto;
  flex-shrink:0;
}
.card.card-backlog-molecule:hover, .card.kanban-molecule:hover{box-shadow:0 0 20px 0 rgba(0,0,0,0.16); transform:translateY(-1px);}
.card.kanban-molecule{cursor:grab;}
.card.kanban-molecule.dragging{opacity:0.4;}

.molecule-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  width:100%;
}
.molecule-header-left{
  display:flex;
  align-items:flex-start;
  gap:8px;
  min-width:0;
}
.molecule-phone-icon{flex-shrink:0; margin-top:1px; color:var(--mm-gray-dark);}
.molecule-texts{display:flex; flex-direction:column; gap:4px; min-width:0;}
.molecule-name{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:0.01em;
  text-transform:uppercase;
  color:var(--mm-green);
  line-height:1.2;
}
.molecule-phone{
  font-family:'Inter',sans-serif;
  font-weight:700;
  font-size:19px;
  color:var(--mm-gray-dark);
  line-height:1.2;
  text-decoration:none;
  display:block;
}
.molecule-phone:hover{color:var(--mm-green-dark);}
.molecule-email{
  font-family:'Inter',sans-serif;
  font-weight:400;
  font-size:13px;
  color:var(--mm-gray);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;
}
.molecule-time{
  font-family:'Inter',sans-serif;
  font-size:12.5px;
  color:var(--mm-gray-dark);
  white-space:nowrap;
  flex-shrink:0;
}

.molecule-body{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
  padding-left:29px;
}
.molecule-row{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:400;
  color:var(--mm-gray);
  line-height:1.4;
}
.molecule-row-strong{
  color:var(--mm-gray-dark);
  font-weight:600;
  text-transform:uppercase;
  font-size:13px;
  letter-spacing:0.01em;
}
.molecule-note{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.molecule-location{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--mm-gray);
}
.molecule-location span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.molecule-pin-icon{display:inline-flex; color:var(--mm-gray); flex-shrink:0;}

.molecule-footer{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  padding-top:12px;
  border-top:1px solid var(--surface-2);
  width:100%;
}

/* Right-side "atom" in the Kanban Molecule header — Figma's Lock atom, repurposed per column status */
.kanban-status{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  flex-shrink:0;
  color:var(--mm-gray-dark);
  text-align:center;
}
.kanban-status-icon{display:flex; color:var(--mm-gray-dark);}
.kanban-status-text{
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  font-weight:500;
  color:var(--mm-gray-dark);
  line-height:1.25;
  white-space:nowrap;
}
.kanban-footer-hint{
  font-family:'Inter',sans-serif;
  font-size:11.5px;
  color:var(--mm-gray);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  min-width:0;
}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(20,26,20,0.45);
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:40px 16px;
  overflow-y:auto;
  z-index:100;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface);
  border-radius:14px;
  max-width:520px;
  width:100%;
  box-shadow:var(--shadow-lift);
  overflow:hidden;
}
.modal-head{
  padding:20px 22px 16px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.modal-head h2{
  font-family:'Inter',sans-serif;
  font-size:20px;
  margin:0 0 4px;
}
.modal-head a{
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  color:var(--mm-green-dark);
  text-decoration:none;
}
.modal-close{
  border:none;background:var(--surface-2);
  width:30px;height:30px;border-radius:50%;
  cursor:pointer; font-size:16px; color:var(--ink-soft);
  flex-shrink:0;
}
.modal-close:hover{background:var(--line);}
.modal-body{padding:18px 22px 22px;}
.meta-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 16px;
  margin-bottom:16px;
}
.meta-item .label{font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:2px;}
.meta-item .value{font-size:13.5px; color:var(--ink);}
.status-banner{
  font-size:12.5px;
  padding:8px 12px;
  border-radius:8px;
  margin-bottom:16px;
  font-weight:500;
}
.note-label{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
textarea.note-field{
  width:100%;
  min-height:70px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px 10px;
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  resize:vertical;
  color:var(--ink);
  margin-bottom:14px;
}
textarea.note-field:focus{outline:2px solid var(--mm-green); outline-offset:1px;}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:6px;
}
.action-row-end{justify-content:flex-end;}
.btn{
  border:1px solid var(--line);
  background:var(--surface);
  padding:8px 12px;
  border-radius:8px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover{background:var(--surface-2);}
.btn:focus-visible{outline:2px solid var(--mm-green); outline-offset:1px;}
.btn.primary{background:var(--mm-green); border-color:var(--mm-green); color:#fff;}
.btn.primary:hover{background:var(--mm-green-dark); border-color:var(--mm-green-dark);}
.btn.ghost-danger{color:var(--hot); border-color:var(--hot-lightest);}
.btn.ghost-danger:hover{background:var(--hot-lightest);}
.btn.small{padding:6px 10px; font-size:12px;}

.action-form{
  margin-top:12px;
  padding:14px;
  background:var(--surface-2);
  border-radius:10px;
  border:1px solid var(--line);
}
.action-form h4{margin:0 0 10px; font-size:13px; font-family:'Inter',sans-serif;}
.form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.form-field{display:flex; flex-direction:column; gap:4px; flex:1; min-width:130px;}
.form-field label{font-size:11px; color:var(--ink-soft); font-weight:600;}
.form-field input, .form-field select{
  border:1px solid var(--line);
  border-radius:7px;
  padding:7px 9px;
  font-size:13px;
  font-family:'Inter',sans-serif;
}

/* ---------- Backlog drawer (slide-out panel) ---------- */
.drawer-overlay{
  position:fixed; inset:0;
  background:rgba(20,26,20,0.45);
  display:flex;
  justify-content:flex-end;
  z-index:150;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.drawer-overlay.open{opacity:1; pointer-events:auto;}
.drawer-dropzone-highlight{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  border:3px dashed transparent;
  margin:10px;
  border-radius:16px;
  transition:background-color .15s ease, border-color .15s ease;
}
.drawer-dropzone-highlight.active{
  background:rgba(83,189,4,0.18);
  border-color:var(--mm-green);
}
.drawer-dropzone-label{
  display:none;
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:600;
  color:#fff;
  background:var(--mm-green-dark);
  padding:12px 20px;
  border-radius:10px;
  box-shadow:var(--shadow-lift);
}
.drawer-dropzone-highlight.active .drawer-dropzone-label{display:block;}
.drawer-panel{
  background:var(--surface);
  width:75vw;
  max-width:1400px;
  height:100vh;
  box-shadow:-10px 0 32px rgba(0,0,0,0.18);
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.drawer-overlay.open .drawer-panel{transform:translateX(0);}
@media (max-width:900px){ .drawer-panel{width:100vw;} }

.drawer-header{
  padding:20px 26px 16px;
  border-bottom:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  flex-shrink:0;
}
.drawer-header h2{font-family:'Inter',sans-serif; font-size:22px; margin:0 0 5px; color:var(--ink);}
.drawer-count-badge{
  font-family:'Inter',sans-serif;
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:2px 10px;
  border-radius:20px;
  margin-bottom:5px;
}
.drawer-header-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.drawer-toolbar{
  padding:14px 26px;
  display:flex; flex-direction:column; gap:10px;
  border-bottom:1px solid var(--line);
  background:var(--surface-2);
  flex-shrink:0;
}
.search-wrap-full{width:100%;}
.search-wrap-full input{width:100%;}

.filter-group{
  display:flex;
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:var(--surface);
}
.filter-group select.filter{
  flex:1;
  min-width:0;
  border:none;
  border-radius:0;
  border-right:1px solid var(--line);
  background:var(--surface);
}
.filter-group select.filter:last-child{border-right:none;}
.filter-group select.filter:focus-visible{outline:2px solid var(--mm-green); outline-offset:-2px; position:relative; z-index:1;}
@media (max-width:760px){
  .filter-group{flex-wrap:wrap;}
  .filter-group select.filter{flex:1 1 50%; border-bottom:1px solid var(--line);}
}
.drawer-meta{
  padding:14px 26px;
  font-size:12.5px;
  color:var(--ink-soft);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.drawer-grid{
  flex:1;
  overflow-y:auto;
  padding:14px 26px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:14px;
  align-content:start;
}
.drawer-grid.empty{
  display:flex;
  align-items:center;
  justify-content:center;
}
.drawer-grid.empty .empty-hint{width:100%; max-width:360px;}
.drawer-loadmore{padding:6px 26px 22px; text-align:center; flex-shrink:0;}

.queue-btn{
  border:1px solid var(--mm-green);
  background:#fff;
  color:var(--mm-green-dark);
  font-size:11.5px;
  font-weight:600;
  padding:6px 11px;
  border-radius:20px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}
.queue-btn:hover{background:var(--mm-green-lightest);}
.queue-btn.queued{background:var(--mm-green); color:#fff;}
.queue-btn.queued:hover{background:var(--mm-green-dark); border-color:var(--mm-green-dark);}
.molecule-footer-right{display:flex; gap:8px; align-items:center; flex:1; justify-content:flex-end;}

/* ---------- Backlog selection ---------- */
.card.card-backlog-molecule{position:relative;}
.select-check{
  position:absolute;
  top:12px; right:12px;
  width:22px; height:22px;
  border-radius:50%;
  border:2px solid var(--mm-gray-line);
  background:var(--mm-gray-light);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff;
  transition:background .15s ease, border-color .15s ease;
}
.card.card-backlog-molecule.selected{
  border-color:var(--mm-green);
  box-shadow:0 0 0 2px var(--mm-green), 0 0 16px 0 rgba(0,0,0,0.1);
}
.card.card-backlog-molecule.selected .select-check{
  background:var(--mm-green);
  border-color:var(--mm-green);
}

.drawer-bottom-bar{flex-shrink:0;}
.drawer-selection-bar{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px 26px;
  background:var(--mm-green-lightest);
  border-top:1px solid var(--line);
}
.drawer-selection-bar.visible{display:flex;}
.selection-bar-text{font-size:13px; color:var(--ink); display:flex; flex-direction:column; gap:2px;}
.selection-bar-text strong{color:var(--mm-green-dark); font-size:14px;}
.selection-bar-hint{font-size:11.5px; color:var(--ink-soft); font-weight:400;}
.selection-bar-actions{display:flex; gap:8px; flex-shrink:0;}

/* ---------- Countdown expiry states (board card) ---------- */
.card.kanban-molecule.near-expiry{
  border-left:1px solid var(--hot);
  box-shadow:0 0 0 1px var(--hot), 0 0 16px 0 rgba(209,9,16,0.15);
  animation:expiryPulse 2.2s ease-in-out infinite;
}
.card.kanban-molecule.near-expiry .kanban-status-icon,
.card.kanban-molecule.near-expiry .kanban-status-text{color:var(--hot);}
@keyframes expiryPulse{
  0%, 100%{box-shadow:0 0 0 1px var(--hot), 0 0 16px 0 rgba(209,9,16,0.15);}
  50%{box-shadow:0 0 0 1px var(--hot), 0 0 22px 4px rgba(209,9,16,0.28);}
}

/* Toast */
.toast{
  position:fixed;

/* ================= CLAIM / COUNTDOWN ================= */
// How long a claimed backlog contact stays exclusive to the agent who claimed it,
// based on how "contested" that lead source typically is.
const SOURCE_DURATION_HOURS = {
  "Sreality": 1,
  "Poptávka z webu": 1,
  "Facebook inzerát": 8,
  "Bazoš": 8,
  "Telefonická poptávka": 8,
  "Realitní seminář": 8,
  "Doporučení": 24,
  "Vlastní databáze": 24,
};
function getClaimDurationHours(source){ return SOURCE_DURATION_HOURS[source] ?? 8; }

function getRemainingMs(c){
  if(!c.claimedAt || !c.claimDurationHours) return null;
  const totalMs = c.claimDurationHours * 3600000;
  return (c.claimedAt + totalMs) - Date.now();
}
function isExpired(c){ const r = getRemainingMs(c); return r !== null && r <= 0; }
function isCriticalExpiry(c){ const r = getRemainingMs(c); return r !== null && r > 0 && r <= 15*60000; }
function isNearExpiry(c){
  const r = getRemainingMs(c);
  if(r === null || r <= 0) return false;
  return r <= (c.claimDurationHours * 3600000) * 0.2;
}
function formatCountdown(c){
  const r = getRemainingMs(c);
  if(r === null) return '—';
  if(r <= 0) return 'Vypršelo';
  const totalMinutes = Math.ceil(r / 60000);
  if(c.claimDurationHours === 1) return `${totalMinutes} min`;
  return `${Math.ceil(totalMinutes/60)} h`;
}

function claimContacts(ids){
  const now = Date.now();
  let claimed = 0;
  ids.forEach(id => {
    const c = getContact(id);
    if(!c || c.status !== 'backlog' || c.queued) return;
    c.queued = true;
    c.claimedAt = now;
    c.claimDurationHours = getClaimDurationHours(c.source);
    if(!c.temp) c.temp = 'warm';
    claimed++;
  });
  return claimed;
}
function unclaimContact(id){
  const c = getContact(id);
  if(!c) return;
  c.queued = false;
  c.claimedAt = null;
  c.claimDurationHours = null;
}

/* ================= EXPIRY WATCH ================= */
const alertedCriticalIds = new Set();
function expiryTick(){
  const queued = contacts.filter(c => c.status === 'backlog' && c.queued);
  let changed = false;
  queued.forEach(c => {
    if(isExpired(c)){
      showToast(`⏱ ${c.name} — čas vypršel, kontakt se vrátil do sdíleného backlogu.`);
      unclaimContact(c.id);
      alertedCriticalIds.delete(c.id);
      changed = true;
    } else if(isCriticalExpiry(c) && !alertedCriticalIds.has(c.id)){
      alertedCriticalIds.add(c.id);
      showToast(`⚠ ${c.name} — méně než 15 minut do vypršení rezervace!`);
    }
  });
  renderBoard();
  if(changed) renderDrawer();
}
setInterval(expiryTick, 20000);

}

  if(!str) return 0;
  const [h, mi] = str.split(':').map(Number);

function statusAtom(c){
  if(c.status === 'backlog') return `<span class="kanban-status-icon">${ICON_LOCK}</span><span class="kanban-status-text">${esc(formatCountdown(c))}</span>`;
  if(c.status === 'meetings') return `<span class="kanban-status-icon">${ICON_CALENDAR}</span><span class="kanban-status-text">${esc(c.meetingDate)}<br>${esc(c.meetingTime)}</span>`;
  if(c.status === 'later') return `<span class="kanban-status-icon">${ICON_CLOCK}</span><span class="kanban-status-text">${esc(c.nextCallDate)}</span>`;
  if(c.status === 'acquired') return `<span class="kanban-status-icon">${ICON_KEY}</span><span class="kanban-status-text">${esc(c.commission)}</span>`;
  return '';
}
function renderStandardCard(c){
  const nearExpiry = c.status === 'backlog' && c.queued && isNearExpiry(c);
  return `
  <div class="card kanban-molecule${nearExpiry ? ' near-expiry' : ''}" draggable="true" data-id="${c.id}" tabindex="0" role="button" aria-label="Karta kontaktu ${esc(c.name)}">
    <div class="molecule-header">
      <div class="molecule-header-left">
        <span class="molecule-phone-icon">${ICON_PHONE}</span>
        <div class="molecule-texts">
          <div class="molecule-name">${esc(c.name)}</div>
          <a class="molecule-phone" href="tel:${esc(c.phone.replace(/\s/g,''))}" onclick="event.stopPropagation()">${esc(c.phone)}</a>
          <div class="molecule-email">${esc(c.email)}</div>
        </div>
      </div>
      <div class="kanban-status">${statusAtom(c)}</div>
    </div>
    <div class="molecule-body">
      <div class="molecule-row molecule-row-strong">${esc(descriptionFor(c))}</div>
      <div class="molecule-row">Prodej · ${fmtCZK(c.price)}</div>
      <div class="molecule-row">${esc(c.type)} · ${fmtArea(c.area)}</div>
      <div class="molecule-row molecule-location">
        <span class="molecule-pin-icon">${ICON_PIN}</span><span>${esc(c.locality)}</span>
      </div>
    </div>
    <div class="molecule-footer">
      <span class="kanban-footer-hint">${footerHint(c)}</span>
      <div class="molecule-footer-right">
        <button class="call-btn" title="Otevřít kartu kontaktu" onclick="event.stopPropagation(); openModal(${c.id});">☎</button>
      </div>
    </div>
  </div>`;
}

function renderBoard(){
  ['backlog','meetings','later','acquired'].forEach(status => {
    let list = status === 'backlog'
      ? contacts.filter(c => c.status === 'backlog' && c.queued && matchesFilters(c))
      : contacts.filter(c => c.status === status && matchesFilters(c));

    if(status === 'meetings') list.sort((a,b)=> (parseCzDate(a.meetingDate)+parseCzTime(a.meetingTime)) - (parseCzDate(b.meetingDate)+parseCzTime(b.meetingTime)));
    if(status === 'later') list.sort((a,b)=> parseCzDate(a.nextCallDate) - parseCzDate(b.nextCallDate));
    if(status === 'acquired') list.sort((a,b)=> parseCzDate(b.acquiredDate) - parseCzDate(a.acquiredDate));
    if(status === 'backlog') { list.sort((a,b)=> (b.claimedAt??0)-(a.claimedAt??0)); }

    const container = document.getElementById('cards-'+status);
    const queuedTotal = contacts.filter(c => c.status === 'backlog' && c.queued).length;
    if(status === 'backlog' && queuedTotal === 0){
      container.innerHTML = `<div class="empty-hint">Fronta na dnešek je prázdná.<br><button class="btn primary small" style="margin-top:10px" onclick="openBacklogPanel()">📂 Otevřít Backlog</button></div>`;
    } else {
      container.innerHTML = list.length
        ? list.map(renderCard).join('')
        : `<div class="empty-hint">Žádné kontakty neodpovídají filtru.</div>`;
    }
    document.getElementById('count-'+status).textContent = status === 'backlog' ? queuedTotal : contacts.filter(c=>c.status===status).length;
  });

  // attach drag/click handlers to Kanban board cards only (the Backlog drawer has its own renderer)
  document.getElementById('board').querySelectorAll('.card').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('click', () => openModal(card.dataset.id));
    card.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(card.dataset.id); } });
  });

}

/* ================= DROPZONES ================= */
document.querySelectorAll('.cards').forEach(zone => {
  const column = zone.closest('.column');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); column.classList.add('column-drag-over'); });
  zone.addEventListener('dragleave', () => { zone.classList.remove('drag-over'); column.classList.remove('column-drag-over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    column.classList.remove('column-drag-over');
    const id = e.dataTransfer.getData('text/plain');
    const newStatus = column.dataset.status;
    handleDrop(id, newStatus);
  });
});

function handleDrop(id, newStatus){
  const c = getContact(id);
  if(!c || (c.status === newStatus && !(newStatus==='backlog' && c.queued))) return;
  if(newStatus === 'backlog'){
    c.status = 'backlog';
    unclaimContact(c.id);
    renderBoard(); renderDrawer();
    showToast(`${c.name} přesunut/a zpět do sdíleného backlogu.`);
    return;
  }
  // needs extra data -> open modal with the relevant action form pre-triggered
  openModal(id);
  triggerActionForm(newStatus);
}

/* ================= MODAL ================= */
function openModal(id){
  activeId = Number(id);
  pendingAction = null;
  document.getElementById('modalOverlay').classList.add('open');
  renderModal();
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  activeId = null;
  pendingAction = null;
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target.id === 'modalOverlay') closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(document.getElementById('modalOverlay').classList.contains('open')) closeModal();
  else if(backlogPanelOpen) closeBacklogPanel();
});

function renderModal(){
  const c = getContact(activeId);
  if(!c) return;
  const modal = document.getElementById('modal');

  let banner = '';
  if(c.status === 'meetings') banner = `<div class="status-banner" style="background:${STATUS_BG.meetings}; color:${STATUS_COLOR.meetings}">📅 Schůzka domluvena na ${c.meetingDate} v ${c.meetingTime}</div>`;
  if(c.status === 'later') banner = `<div class="status-banner" style="background:${STATUS_BG.later}; color:${STATUS_COLOR.later}">🔁 Naplánován zpětný hovor na ${c.nextCallDate}</div>`;
  if(c.status === 'acquired') banner = `<div class="status-banner" style="background:${STATUS_BG.acquired}; color:${STATUS_COLOR.acquired}">🏠 Nemovitost nabrána ${c.acquiredDate} • Exkluzivita: ${c.exclusivity} • Provize ${c.commission}</div>`;

  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <h2>${esc(c.name)}</h2>
        <a href="tel:${esc(c.phone.replace(/\\s/g,''))}">${esc(c.phone)}</a>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Zavřít">✕</button>
    </div>
    <div class="modal-body">
      ${banner}
      <div class="meta-grid">
        <div class="meta-item"><div class="label">Lokalita</div><div class="value">${esc(c.locality)}</div></div>
        <div class="meta-item"><div class="label">Typ nemovitosti</div><div class="value">${esc(c.type)}</div></div>
        <div class="meta-item"><div class="label">Plocha</div><div class="value">${fmtArea(c.area)}</div></div>
        <div class="meta-item"><div class="label">Cena / odhad</div><div class="value">${fmtCZK(c.price)}</div></div>
        <div class="meta-item"><div class="label">Zdroj kontaktu</div><div class="value">${esc(c.source)}</div></div>
        <div class="meta-item"><div class="label">Sloupec</div><div class="value">${STATUS_LABEL[c.status]}</div></div>
      </div>

      <label class="note-label" for="noteField">Poznámka z hovoru</label>
      <textarea id="noteField" class="note-field">${esc(c.note)}</textarea>

      <div class="action-row" id="actionRow">
        ${renderActionButtons(c)}
      </div>
      <div id="actionFormArea"></div>

      <div class="action-row action-row-end" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <button class="btn primary small" onclick="saveNote()">Uložit poznámku</button>
      </div>
    </div>
  `;
}

function renderActionButtons(c){
  let buttons = '';
  if(c.status !== 'meetings') buttons += `<button class="btn" onclick="triggerActionForm('meetings')">📅 Domluvit schůzku</button>`;
  if(c.status !== 'later') buttons += `<button class="btn" onclick="triggerActionForm('later')">🔁 Zavolat později</button>`;
  if(c.status !== 'acquired') buttons += `<button class="btn" onclick="triggerActionForm('acquired')">🏠 Nabral/a nemovitost</button>`;
  if(c.status === 'backlog' && !c.queued) buttons += `<button class="btn primary" onclick="claimContacts([${c.id}]); renderBoard(); renderDrawer(); renderModal(); showToast('${esc(c.name)} zařazen/a mezi kontakty.');">📥 Zařadit mezi kontakty</button>`;
  if(c.status !== 'backlog') buttons += `<button class="btn" onclick="moveTo('backlog')">↩ Zpět do zásobníku</button>`;
  if(c.status === 'backlog' && c.queued) buttons += `<button class="btn" onclick="unclaimContact(${c.id}); renderBoard(); renderDrawer(); renderModal(); showToast('${esc(c.name)} odebrán/a z dnešní fronty.');">➖ Odebrat z dnešní fronty</button>`;
  if(c.status !== 'acquired') buttons += `<button class="btn ghost-danger" onclick="archiveContact()">✖ Zpět do backlogu</button>`;
  return buttons;
}

function triggerActionForm(type){
  pendingAction = type;
  const area = document.getElementById('actionFormArea');
  if(type === 'meetings'){
    area.innerHTML = `
      <div class="action-form">
        <h4>Domluvit schůzku</h4>
        <div class="form-row">
          <div class="form-field"><label>Datum</label><input type="text" id="f-meetingDate" placeholder="např. 24.7.2026"></div>
          <div class="form-field"><label>Čas</label><input type="text" id="f-meetingTime" placeholder="např. 14:00"></div>
        </div>
        <button class="btn primary small" onclick="confirmMeeting()">Potvrdit schůzku</button>
        <button class="btn small" onclick="cancelActionForm()">Zrušit</button>
      </div>`;
  } else if(type === 'later'){
    area.innerHTML = `
      <div class="action-form">
        <h4>Naplánovat zpětný hovor</h4>
        <div class="form-row">
          <div class="form-field"><label>Zavolat znovu dne</label><input type="text" id="f-nextCall" placeholder="např. 28.7.2026"></div>
        </div>
        <button class="btn primary small" onclick="confirmLater()">Potvrdit termín</button>
        <button class="btn small" onclick="cancelActionForm()">Zrušit</button>
      </div>`;
  } else if(type === 'acquired'){
    area.innerHTML = `
      <div class="action-form">
        <h4>Nabrání nemovitosti</h4>
        <div class="form-row">
          <div class="form-field"><label>Exkluzivita</label>
            <select id="f-exclusivity"><option value="Ano">Ano</option><option value="Ne">Ne</option></select>
          </div>
          <div class="form-field"><label>Provize</label><input type="text" id="f-commission" placeholder="např. 3 %"></div>
        </div>
        <button class="btn primary small" onclick="confirmAcquired()">Potvrdit nabrání</button>
        <button class="btn small" onclick="cancelActionForm()">Zrušit</button>
      </div>`;
  }
}

function cancelActionForm(){
  pendingAction = null;
  document.getElementById('actionFormArea').innerHTML = '';
}

function confirmMeeting(){
  const c = getContact(activeId);
  const date = document.getElementById('f-meetingDate').value.trim() || 'nezadáno';
  const time = document.getElementById('f-meetingTime').value.trim() || '—';
  c.status = 'meetings'; c.meetingDate = date; c.meetingTime = time;
  renderBoard(); renderModal();
  showToast(`Schůzka s ${c.name} naplánována na ${date} ${time}.`);
}
function confirmLater(){
  const c = getContact(activeId);
  const date = document.getElementById('f-nextCall').value.trim() || 'nezadáno';
  c.status = 'later'; c.nextCallDate = date;
  renderBoard(); renderModal();
  showToast(`${c.name} přesunut/a do „Zavolat“ (${date}).`);
}
function confirmAcquired(){
  const c = getContact(activeId);
  const excl = document.getElementById('f-exclusivity').value;
  const comm = document.getElementById('f-commission').value.trim() || '—';
  c.status = 'acquired'; c.exclusivity = excl; c.commission = comm; c.acquiredDate = new Date().toLocaleDateString('cs-CZ');
  renderBoard(); renderModal();
  showToast(`🏠 Nemovitost od ${c.name} nabrána do portfolia!`);
}
function moveTo(status){
  const c = getContact(activeId);
  c.status = status;
  if(status === 'backlog'){ unclaimContact(c.id); }
  renderBoard(); renderModal();
  showToast(`${c.name} přesunut/a do „${STATUS_LABEL[status]}“.`);
}
function archiveContact(){
  const c = getContact(activeId);
  contacts = contacts.filter(x => x.id !== c.id);
  closeModal(); renderBoard();
  showToast(`${c.name} byl/a archivován/a (bez zájmu).`);
}
function saveNote(){
  const c = getContact(activeId);
  c.note = document.getElementById('noteField').value;
  c.lastCall = new Date().toLocaleDateString('cs-CZ');
  renderBoard(); renderModal();
  showToast('Poznámka uložena.');
}

/* ================= BACKLOG DRAWER (slide-out panel) ================= */
let backlogPanelOpen = false;
let backlogVisibleCount = 12;
const BACKLOG_PAGE_SIZE = 12;

function openBacklogPanel(){
  backlogPanelOpen = true;
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('backlogToggleBtn').setAttribute('aria-pressed', 'true');
  document.body.style.overflow = 'hidden';
  renderDrawer();
}
function closeBacklogPanel(){
  backlogPanelOpen = false;
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('backlogToggleBtn').setAttribute('aria-pressed', 'false');
  document.body.style.overflow = '';
}
function toggleBacklogPanel(){ backlogPanelOpen ? closeBacklogPanel() : openBacklogPanel(); }

function toggleTooltip(e, tipId){
  e.stopPropagation();
  const tip = document.getElementById(tipId);
  const btn = e.currentTarget;
  const open = tip.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(open));
}
document.addEventListener('click', (e) => {
  document.querySelectorAll('.help-tooltip.open').forEach(tip => {
    const wrap = tip.closest('.h1-wrap, .drawer-title-wrap');
    if(!wrap || !wrap.contains(e.target)){
      tip.classList.remove('open');
      const btn = wrap ? wrap.querySelector('.info-icon-btn') : null;
      if(btn) btn.setAttribute('aria-expanded', 'false');
    }
  });
});

const ICON_MOON_SVG = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
const ICON_SUN_SVG = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
function toggleTheme(){
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  if(next === 'dark'){ html.setAttribute('data-theme','dark'); } else { html.removeAttribute('data-theme'); }
  document.getElementById('themeToggleBtn').setAttribute('aria-pressed', String(next === 'dark'));
  // Label/icon always describe the state you're switching TO.
  document.getElementById('themeLabel').textContent = next === 'dark' ? 'light mode' : 'dark mode';
  document.getElementById('themeIcon').innerHTML = next === 'dark' ? ICON_SUN_SVG : ICON_MOON_SVG;
}
document.getElementById('drawerOverlay').addEventListener('click', e => {
  if(!e.target.closest('.drawer-panel')) closeBacklogPanel();
}, true);

/* ================= BACKLOG DRAG & DROP (drag a card onto the dimmed board area to claim it) ================= */
function dragBacklogCardStart(e, id){
  e.dataTransfer.setData('text/plain', String(id));
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function dragBacklogCardEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.getElementById('drawerDropzoneHighlight').classList.remove('active');
}
(function(){
  const overlay = document.getElementById('drawerOverlay');
  const highlight = document.getElementById('drawerDropzoneHighlight');
  overlay.addEventListener('dragover', e => {
    if(e.target.closest('.drawer-panel')){ highlight.classList.remove('active'); return; }
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    highlight.classList.add('active');
  });
  overlay.addEventListener('dragleave', e => {
    if(e.target === overlay || e.target === highlight) highlight.classList.remove('active');
  });
  overlay.addEventListener('drop', e => {
    highlight.classList.remove('active');
    if(e.target.closest('.drawer-panel')) return;
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    if(!id) return;
    const c = getContact(id);
    if(!c) return;
    let ids;
    if(selectedBacklogIds.has(Number(id)) && selectedBacklogIds.size > 1){
      ids = [...selectedBacklogIds];
    } else {
      ids = [Number(id)];
    }
    const n = claimContacts(ids);
    if(n > 0){
      selectedBacklogIds.clear();
      renderBoard(); renderDrawer();
      showToast(n === 1 ? `${c.name} zařazen/a mezi kontakty.` : `${n} kontaktů zařazeno mezi kontakty.`);
    }
  });
})();

function populateBacklogFilters(){
  const pool = contacts.filter(c => c.status === 'backlog' && !c.queued);
  const typeSel = document.getElementById('backlogTypeFilter');
  const types = [...new Set(pool.map(c => c.type))].sort();
  typeSel.innerHTML = '<option value="all">Všechny typy nemovitostí</option>' +
    types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');

  const sourceSel = document.getElementById('backlogSourceFilter');
  const sources = [...new Set(pool.map(c => c.source))].sort();
  sourceSel.innerHTML = '<option value="all">Všechny zdroje</option>' +
    sources.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
}

function matchesBacklogFilters(c){
  const term = document.getElementById('backlogSearchInput').value.trim().toLowerCase();
  const type = document.getElementById('backlogTypeFilter').value;
  const source = document.getElementById('backlogSourceFilter').value;
  if(term){
    const hay = `${c.name} ${c.locality} ${c.phone} ${c.type} ${c.note} ${c.email}`.toLowerCase();
    if(!hay.includes(term)) return false;
  }
  if(type !== 'all' && c.type !== type) return false;
  if(source !== 'all' && c.source !== source) return false;
  return true;
}

function sortBacklogList(list){
  const key = document.getElementById('backlogSortSelect').value;
  const arr = [...list];
  if(key === 'az'){ arr.sort((a,b)=> a.name.localeCompare(b.name,'cs')); }
  else if(key === 'priceDesc'){ arr.sort((a,b)=> b.price - a.price); }
  else if(key === 'priceAsc'){ arr.sort((a,b)=> a.price - b.price); }
  else if(key === 'lastCall'){ arr.sort((a,b)=> parseCzDate(b.lastCall) - parseCzDate(a.lastCall)); }
  return arr;
}

function hasActiveBacklogFilters(){
  const search = document.getElementById('backlogSearchInput').value.trim();
  const type = document.getElementById('backlogTypeFilter').value;
  const source = document.getElementById('backlogSourceFilter').value;
  return search !== '' || type !== 'all' || source !== 'all';
}
function resetBacklogFilters(){
  document.getElementById('backlogSearchInput').value = '';
  document.getElementById('backlogTypeFilter').value = 'all';
  document.getElementById('backlogSourceFilter').value = 'all';
  resetBacklogPagingAndRender();
}
function renderDrawer(){
  const pool = contacts.filter(c => c.status === 'backlog' && !c.queued);
  const filtered = sortBacklogList(pool.filter(matchesBacklogFilters));
  const visible = filtered.slice(0, backlogVisibleCount);

  document.getElementById('drawerTotalCount').textContent = pool.length;
  document.getElementById('drawerResetFiltersBtn').style.display = hasActiveBacklogFilters() ? 'inline-flex' : 'none';

  document.getElementById('drawerMeta').textContent =
    `Zobrazeno ${visible.length} z ${filtered.length} odpovídajících kontaktů (kontaktů v backlogu celkem: ${pool.length}).`;

  const grid = document.getElementById('drawerGrid');
  grid.classList.toggle('empty', visible.length === 0);
  grid.innerHTML = visible.length
    ? visible.map(renderBacklogPanelCard).join('')
    : `<div class="empty-hint">Žádné kontakty neodpovídají filtru.</div>`;

  const loadMoreWrap = document.getElementById('drawerLoadMoreWrap');
  loadMoreWrap.innerHTML = filtered.length > visible.length
    ? `<button class="btn" onclick="backlogVisibleCount += ${BACKLOG_PAGE_SIZE}; renderDrawer();">Načíst dalších ${Math.min(BACKLOG_PAGE_SIZE, filtered.length - visible.length)}</button>`
    : '';

  const bar = document.getElementById('drawerSelectionBar');
  const n = selectedBacklogIds.size;
  if(n > 0){
    bar.innerHTML = `
      <div class="selection-bar-text">
        <strong>${n}</strong> ${n === 1 ? 'kontakt vybrán' : (n < 5 ? 'kontakty vybrány' : 'kontaktů vybráno')}
        <span class="selection-bar-hint">Po přesunu je uvidíte jen vy — ostatním makléřům dočasně zmizí z backlogu, dokud neuplyne časový limit.</span>
      </div>
      <div class="selection-bar-actions">
        <button class="btn small" onclick="clearSelection()">Zrušit výběr</button>
        <button class="btn primary small" onclick="claimSelected()">➜ Zařadit mezi kontakty (${n})</button>
      </div>`;
    bar.classList.add('visible');
  } else {
    bar.innerHTML = '';
    bar.classList.remove('visible');
  }
}

/* ================= TOAST ================= */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================= INIT ================= */
document.getElementById('searchInput').addEventListener('input', renderBoard);
document.getElementById('typeFilter').addEventListener('change', renderBoard);

function resetBacklogPagingAndRender(){ backlogVisibleCount = BACKLOG_PAGE_SIZE; renderDrawer(); }
document.getElementById('backlogSearchInput').addEventListener('input', resetBacklogPagingAndRender);
document.getElementById('backlogTypeFilter').addEventListener('change', resetBacklogPagingAndRender);
document.getElementById('backlogSourceFilter').addEventListener('change', resetBacklogPagingAndRender);
document.getElementById('backlogSortSelect').addEventListener('change', resetBacklogPagingAndRender);

populateTypeFilter();
populateBacklogFilters();
renderBoard();
</script>
</body>
</html>
